name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          # Delete package-lock to avoid platform-specific optional dependency mismatch
          rm -f package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Build Android App (APK & AAB for Google Play)
        run: |
          cd android
          chmod +x gradlew
          echo "Starting assembleDebug..."
          if ! ./gradlew assembleDebug > assemble_debug.log 2>&1; then
            echo "=== ASSEMBLE DEBUG FAILED (LAST 200 LINES) ==="
            tail -n 200 assemble_debug.log
            exit 1
          fi
          echo "Starting bundleRelease..."
          if ! ./gradlew bundleRelease > bundle_release.log 2>&1; then
            echo "=== BUNDLE RELEASE FAILED (LAST 200 LINES) ==="
            tail -n 200 bundle_release.log
            exit 1
          fi

      - name: Upload Debug APK (For Testing)
        uses: actions/upload-artifact@v4
        with:
          name: souq-iraq-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB (For Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: souq-iraq-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
