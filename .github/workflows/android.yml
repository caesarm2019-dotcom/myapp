name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build Web Application
        run: npm run build

      # 🔥 توليد الأيقونات (أهم خطوة)
      - name: Generate App Icons
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate

      # 🔄 مزامنة Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # ☕ إعداد Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 🧹 تنظيف build
      - name: Clean Android Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean

      # 📦 بناء التطبيق
      - name: Build Android App (APK & AAB)
        run: |
          cd android
          echo "Starting assembleDebug..."
          if ! ./gradlew assembleDebug > assemble_debug.log 2>&1; then
            echo "=== ASSEMBLE DEBUG FAILED ==="
            tail -n 200 assemble_debug.log
            exit 1
          fi

          echo "Starting bundleRelease..."
          if ! ./gradlew bundleRelease > bundle_release.log 2>&1; then
            echo "=== BUNDLE RELEASE FAILED ==="
            tail -n 200 bundle_release.log
            exit 1
          fi

      # 📤 رفع APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 📤 رفع AAB
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
